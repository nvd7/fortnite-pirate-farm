name: testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar
        run: python -m compileall -q main.py selftest.py piratebot tools

      - name: Verificar links da documentação
        run: python tools/check_docs.py

      - name: Autoteste offline
        shell: pwsh
        run: |
          python selftest.py 2>&1 | Tee-Object -FilePath selftest.log
          exit $LASTEXITCODE

      - name: Publicar diagnóstico em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-selftest
          path: |
            selftest.log
            logs/
          if-no-files-found: ignore
          retention-days: 7
