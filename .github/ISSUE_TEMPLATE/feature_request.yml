name: Sugerir uma melhoria
description: Tem uma ideia de recurso, template ou melhoria de usabilidade?
title: "[Ideia] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve?
      placeholder: "Ex.: preciso limitar o farm por tempo sem editar o JSON."
    validations:
      required: true

  - type: textarea
    id: solucao
    attributes:
      label: Solução proposta
      placeholder: "Um campo na interface para definir o limite em minutos."
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      placeholder: "Editar max_runtime_minutes no config.json antes de iniciar."
    validations:
      required: false

  - type: textarea
    id: contexto
    attributes:
      label: Contexto adicional
      description: Capturas, exemplos ou links que ajudem a entender a ideia.
    validations:
      required: false
